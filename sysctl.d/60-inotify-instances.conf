# Installed by configure-gnome-desktop.sh, which overwrites edits made here.
#
# Each user may hold 1024 inotify instances, instead of the kernel's default of 128. A program which watches files,
# through GLib's file monitors for example, holds one or more, and a GNOME session holds about 60. The session tests
# (tests/session/) run whole GNOME sessions in containers of rootless Docker, whose processes count against the user who
# runs Docker, so a few of them side by side with the desktop used up the 128, and their programs failed to watch
# files, mutter's tests with "Unable to find default local file monitor type". The number of watches, which
# /usr/lib/sysctl.d/30-localsearch.conf raises, is a separate limit.
fs.inotify.max_user_instances = 1024
