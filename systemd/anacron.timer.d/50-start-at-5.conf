# Installed as /etc/systemd/system/anacron.timer.d/50-start-at-5.conf by install-rebuild-patched-packages.sh, which
# overwrites edits made there.
#
# anacron runs the daily cron jobs, among them rebuild-patched-packages, in the first of its runs on a day. Ubuntu's
# anacron.timer starts it every hour from 07:30 to 23:30, and this adds a run at 05:00, so that on a laptop left on
# overnight the daily jobs start between 05:05 and 05:10: anacron.timer delays a run by up to 5 minutes and
# /etc/anacrontab delays the daily jobs by 5 more. The hourly runs find the jobs already done that day and exit. A
# run which elapses while the laptop is suspended or off is made when it resumes or boots, and anacron runs only on
# AC power, so on battery the jobs wait for the next hourly run on AC.
#
# 05:00 follows the daily measurement of health-benchmark, which starts at 04:00, usually lasts 22 minutes, and is
# stopped by its service's TimeoutStartSec=1h at the latest. The measurement records nothing when another process used
# the processor meanwhile. A Firefox rebuild, the longest at about 50 minutes, then usually ends before
# apt-daily-upgrade runs unattended-upgrades between 06:00 and 07:00, which installs the rebuilt packages the same
# morning.
#
# An OnCalendar line with a value adds a trigger to those of anacron.timer, so Ubuntu's own triggers stay.

[Timer]
OnCalendar=*-*-* 05:00
