# Installed as /etc/systemd/user/xdg-desktop-portal-gtk.service.d/50-requisite-graphical-session.conf by
# configure-gnome-desktop.sh, which overwrites edits made there.
#
# xdg-desktop-portal starts its GTK backend through D-Bus activation once its GNOME backend runs. When a session ends
# soon after it started, the activation can still wait in systemd's queue while the session stops, so the backend
# starts after GNOME Shell is gone, exits with "cannot open display" and leaves the unit failed. Here systemd starts
# it only while graphical-session.target is active, as the unit of xdg-desktop-portal-gnome has it, and a later
# activation fails without a failed unit.
#
# Not needed any more once xdg-desktop-portal-gtk's own unit does the same, as suggested in
# https://github.com/flatpak/xdg-desktop-portal-gtk/pull/515

[Unit]
Requisite=graphical-session.target
