# Installed as /etc/systemd/system.conf.d/50-io-accounting.conf by configure-gnome-desktop.sh, which overwrites edits
# made there.
#
# Turns on disk I/O accounting for every system unit, so that the bytes each service reads and writes are known.
# systemd logs them when a unit stops ("read from disk", "written to disk"), and they show live in "systemctl status"
# and in each unit's io.stat in /sys/fs/cgroup. It makes the SSD's writes attributable to the units which cause them.
#
# io.stat lists a write once for every block device it passes, and the root filesystem here is an LVM volume on a LUKS
# device on the NVMe drive, so systemd's totals, which add up all devices, count every write three times. The line of
# the LVM volume (dm-1) alone has the real amount.
#
# systemd reads this file when it starts, so it applies from the next boot.

[Manager]
DefaultIOAccounting=yes
