# Installed as /etc/systemd/system/user@.service.d/50-delegate-io.conf by configure-gnome-desktop.sh, which overwrites
# edits made there.
#
# Hands the io controller to each user's service manager, which otherwise receives only pids, memory and cpu, so that
# its units can account for their disk I/O (systemd/user.conf.d/50-io-accounting.conf). Controllers listed here add to
# the ones user@.service delegates already.
#
# It applies when the user's service manager starts again, at the next login after all of the user's sessions have
# ended.

[Service]
Delegate=io
