# Installed as /etc/systemd/system/user@.service.d/50-memlock.conf by configure-gnome-desktop.sh, which overwrites
# edits made there.
#
# A program running a model on the NPU, such as FastFlowLM, keeps the model in memory which the NPU reads directly. The
# amdxdna driver pins that memory and counts it against the limit on locked memory. systemd starts each user's service
# manager, and with it the whole graphical session, with a limit of 8 MiB, soft and hard, and the manager passes its own
# limit on to every process it starts. /etc/security/limits.conf does not change it, because the PAM service of the
# manager, systemd-user, does not apply pam_limits.
#
# Both limits are lifted. Lifting only the hard limit is not enough: FastFlowLM, finding its soft limit low, lowers both
# limits to its own estimate of the memory it needs, which is too low for some models and for long contexts.

[Service]
LimitMEMLOCK=infinity
