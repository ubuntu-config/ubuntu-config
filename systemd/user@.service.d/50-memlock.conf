# Installed as /etc/systemd/system/user@.service.d/50-memlock.conf by configure-gnome-desktop.sh, which overwrites
# edits made there.
#
# A program running a model on the NPU, such as FastFlowLM, keeps the model in memory which the NPU reads directly and
# which therefore counts as locked memory. systemd starts each user's service manager, and with it the whole graphical
# session, with a limit of 8 MiB on locked memory, soft and hard, and the manager passes its own limit on to every
# process it starts. /etc/security/limits.conf does not change it, because the PAM service of the manager,
# systemd-user, does not apply pam_limits.
#
# The hard limit is raised to infinity, so that a program can raise its own limit as far as it needs, which FastFlowLM
# does. The soft limit stays at 8 MiB, so that a program which locks memory whenever it is allowed to, such as with
# mlockall, is still limited unless it raises the limit itself.

[Service]
LimitMEMLOCK=8M:infinity
