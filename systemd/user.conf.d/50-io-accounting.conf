# Installed as /etc/systemd/user.conf.d/50-io-accounting.conf by configure-gnome-desktop.sh, which overwrites edits
# made there.
#
# Turns on disk I/O accounting for every unit of each user's service manager: applications, their scopes and
# containers started from the session. It needs the io controller, which systemd/user@.service.d/50-delegate-io.conf
# hands to the user's manager. See systemd/system.conf.d/50-io-accounting.conf for what the accounting records and why
# its totals count every write three times on this laptop.
#
# A user's service manager reads this file when it starts, at the next login after all of the user's sessions have
# ended.

[Manager]
DefaultIOAccounting=yes
