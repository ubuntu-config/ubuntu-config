# Installed by configure-gnome-desktop.sh, which overwrites edits made here.
#
# The driver stays away by default when the embedded controller also offers Framework's own charge limit, the one
# the BIOS changes. Loading it anyway exposes charge thresholds on the battery, which UPower and GNOME Settings use.
# Both end up in the same charge sustainer of the controller. With Framework's firmware and its limit at 100% the
# firmware clears the sustainer every second, so these thresholds never apply. With it below 100% the firmware sets
# its own window, from 5% below the limit up to the limit, only when the limit changes or the controller starts, so
# with Framework's firmware the limit in the BIOS has to be at 99%. The patched firmware of framework-ec, which this
# configuration assumes, clears the sustainer only once, when the limit changes to 100%, so the thresholds apply with
# any limit.
options cros_charge_control probe_with_fwk_charge_control=1
