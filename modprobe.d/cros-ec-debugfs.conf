# Installed by install-ec-log.sh, which overwrites edits made here.
#
# ec-log.service reads the console of the embedded controller into the journal. The EC keeps one position up to which
# its console was read, shared by everything which reads it, and this module reads the console every 10 seconds as well,
# into a buffer of 16 KB under /sys/kernel/debug/cros_ec, so each of the two would miss the lines the other one read.
# The module's buffer is also smaller than the EC's console of 24 KB, and when it is full it drops the newest output,
# which at boot is the start of the laptop. When the module loads, it reads the EC's panic record in the way which
# marks the record as read, so ec-log could not tell a new panic from one which was already reported. Nothing else
# uses the files of the module.
blacklist cros_ec_debugfs
